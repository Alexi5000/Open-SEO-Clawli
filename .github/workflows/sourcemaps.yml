name: Upload sourcemaps
on:
  push:
    branches:
      - main
concurrency:
  group: sourcemaps-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  upload:
    if: vars.ENABLE_POSTHOG_SOURCEMAPS == 'true'
    runs-on: ubuntu-latest
    env:
      POSTHOG_SOURCEMAPS: "true"
      POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST }}
      POSTHOG_CLI_ENV_ID: ${{ vars.POSTHOG_CLI_ENV_ID }}
      POSTHOG_CLI_TOKEN: ${{ secrets.POSTHOG_CLI_TOKEN }}
    steps:
      - name: Validate upload configuration
        run: |
          test -n "$POSTHOG_CLI_HOST" || { echo 'POSTHOG_CLI_HOST is required'; exit 1; }
          test -n "$POSTHOG_CLI_ENV_ID" || { echo 'POSTHOG_CLI_ENV_ID is required'; exit 1; }
          test -n "$POSTHOG_CLI_TOKEN" || { echo 'POSTHOG_CLI_TOKEN is required'; exit 1; }
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and upload sourcemaps
        run: pnpm run sourcemaps:upload
